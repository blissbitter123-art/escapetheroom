{% extends "base.html" %}

{% block title %}SUBMIT ANSWER — ESCAPE THE ROOM{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/team.css') }}">{% endblock %}

{% block content %}
<div class="team-layout">
    <div class="team-card">
        <h3>SUBMIT ANSWER CODE</h3>
        <div class="text-input-box mt-3">
            <input type="text" id="answer-input" placeholder="Type answer code..." class="input-hud-large" autocomplete="off">
            <button onclick="submitFromInput()" class="btn-green btn-full mt-3">SUBMIT ANSWER</button>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{{ url_for('static', filename='js/team.js') }}"></script>
{% endblock %}
