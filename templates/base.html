<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ESCAPE THE ROOM: THE FINAL 60{% endblock %}</title>
    <!-- Fonts & CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&family=Share+Tech+Mono&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body class="theme-dark {% block body_class %}{% endblock %}">
    <div class="hud-scanline"></div>
    <div class="hud-background-grid"></div>

    <main class="app-container">
        {% block content %}{% endblock %}
    </main>

    <!-- Core Scripts -->
    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    <script src="{{ url_for('static', filename='js/timer.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
